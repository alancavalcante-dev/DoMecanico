# Detecção de robôs para "dynamic rendering" (SEO). Precisa ficar em contexto
# http{} — como este arquivo é incluído via sites-enabled (dentro de http{}),
# o map pode ficar aqui no topo, fora do server{}.
map $http_user_agent $prerender_bot {
    default 0;
    "~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|applebot|petalbot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot|embedly|pinterest|redditbot|semrushbot|ahrefsbot)" 1;
}

server {
    listen 80;
    server_name domecanico.net www.domecanico.net;

    # Canonicaliza o host: www → apex (evita conteúdo duplicado no SEO).
    if ($host = www.domecanico.net) {
        return 301 https://domecanico.net$request_uri;
    }

    # ── Cabeçalhos de segurança (aplicados ao SPA/estáticos servidos pelo nginx) ──
    # Locations que fazem proxy para o Django escondem os equivalentes que o Django
    # já envia (proxy_hide_header) para não duplicar.
    add_header X-Frame-Options "DENY" always;                       # anti-clickjacking
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: comece em Report-Only para não quebrar o app; ajuste as origens e,
    # quando os relatórios estiverem limpos, troque para Content-Security-Policy.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'" always;

    # Frontend React (SPA)
    root /root/domecanico/frontend/dist;
    index index.html;

    # Sitemap dinâmico (Django) — inclui os perfis de oficina ativos.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # SPA para humanos; robôs (preview de link, buscadores) recebem HTML
    # pré-renderizado com as meta tags corretas (dynamic rendering).
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        if ($prerender_bot) {
            proxy_pass http://127.0.0.1:8000;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        try_files /index.html =404;
    }

    # Proxy para API Django
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Django já envia estes; evita duplicar com os add_header do server.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Admin Django — recomendado restringir por IP (evita exposição pública).
    # Descomente e ajuste os IPs da sua equipe/VPN antes de usar em produção:
    location /admin/ {
        # allow 203.0.113.10;   # IP fixo do escritório
        # allow 203.0.113.0/24; # faixa da VPN
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Arquivos estáticos Django
    location /static/ {
        alias /root/domecanico/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Mídia (fotos de veículos, logos) — servida DIRETO pelo nginx (storage local).
    # `root /srv/domecanico` serve /media/x de /srv/domecanico/media/x, que é o
    # bind-mount do docker-compose (/srv/domecanico/media:/app/media) onde o
    # backend grava os uploads. (Confere com o nginx ativo da VPS.)
    location /media/ {
        root /srv/domecanico;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    client_max_body_size 20M;
}
