server {
    listen 80;
    server_name domecanico.net www.domecanico.net;

    # Frontend React (SPA)
    root /root/domecanico/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API Django
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos estáticos Django
    location /static/ {
        alias /root/domecanico/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mídia (fotos de veículos, logos) — servida DIRETO pelo nginx (storage local).
    # O caminho é o Mountpoint do volume docker "*_media_files". Descubra com:
    #   docker volume inspect $(docker volume ls -q | grep media) --format '{{ .Mountpoint }}'
    location /media/ {
        alias /var/lib/docker/volumes/domecanico_media_files/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    client_max_body_size 20M;
}
