# Config COMPLETA do site (HTTP + HTTPS) — conteúdo de
# /etc/nginx/sites-available/domecanico na VPS.
#
# ⚠ O deploy.sh NÃO aplica este arquivo. Para aplicar, na VPS:
#   cp /etc/nginx/sites-available/domecanico /root/domecanico-nginx.bak
#   cp /root/domecanico/nginx.conf /etc/nginx/sites-available/domecanico
#   nginx -t && systemctl reload nginx
#   (se o nginx -t falhar: cp /root/domecanico-nginx.bak /etc/nginx/sites-available/domecanico)
#
# Os caminhos de certificado são os que o `certbot --nginx -d domecanico.net
# -d www.domecanico.net` cria (um certificado só, cobrindo os dois nomes).
# A renovação automática (certbot renew) continua funcionando: ela usa os
# mesmos arquivos e o bloco :80 abaixo responde ao desafio ACME.

# Detecção dos robôs de PRÉVIA DE LINK (WhatsApp, Facebook, X, LinkedIn...) para
# "dynamic rendering": eles não executam JS, então recebem do Django um HTML com
# as meta tags certas (card da oficina, etc.). Buscadores (Googlebot, Bingbot)
# ficam FORA de propósito: eles executam JS e indexam a SPA completa, que tem
# muito mais conteúdo que o HTML mínimo do prerender.
# Precisa ficar em contexto http{} — como este arquivo é incluído via
# sites-enabled (dentro de http{}), o map pode ficar aqui no topo.
map $http_user_agent $prerender_bot {
    default 0;
    "~*(facebookexternalhit|facebot|meta-externalagent|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot|skypeuripreview|embedly|pinterest|redditbot|vkshare|iframely)" 1;
}

# ── HTTP → HTTPS (sempre no domínio canônico, sem www) ─────────────────────────
server {
    listen 80;
    server_name domecanico.net www.domecanico.net;

    # Desafio do Let's Encrypt (renovação). O plugin nginx do certbot injeta a
    # própria location exata; esta cobre o modo webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://domecanico.net$request_uri;
    }
}

# ── HTTPS www → apex (evita conteúdo duplicado no Google) ─────────────────────
server {
    listen 443 ssl http2;
    server_name www.domecanico.net;

    ssl_certificate     /etc/letsencrypt/live/domecanico.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domecanico.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://domecanico.net$request_uri;
}

# ── HTTPS principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name domecanico.net;

    ssl_certificate     /etc/letsencrypt/live/domecanico.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domecanico.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Cabeçalhos de segurança (aplicados ao SPA/estáticos servidos pelo nginx) ──
    # Locations que fazem proxy para o Django escondem os equivalentes que o Django
    # já envia (proxy_hide_header) para não duplicar.
    # HSTS igual ao que o Django já envia nas respostas da API (SECURE_HSTS_*).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;                       # anti-clickjacking
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone/camera liberados só para o próprio site: o ditado por voz (Web
    # Speech API) e a foto da OS no Modo Oficina precisam deles. Terceiros: bloqueado.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;
    # CSP em Report-Only (não bloqueia nada). Quando os relatórios estiverem
    # limpos, troque para Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://www.googletagmanager.com; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;

    # Compressão dos estáticos (JS/CSS saíam sem gzip — ~370 KB a mais no 1º acesso).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # Frontend React (SPA)
    root /root/domecanico/frontend/dist;
    index index.html;

    # Bundles do Vite têm hash no nome → cache de 1 ano. Arquivo inexistente
    # devolve 404 de verdade (não o index.html, que quebraria o import do JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Manifest do PWA com o MIME correto (saía como application/octet-stream).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Sitemap dinâmico (Django) — inclui os perfis de oficina ativos.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # SPA para humanos e buscadores; scrapers de prévia de link recebem HTML
    # pré-renderizado com as meta tags corretas (dynamic rendering).
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        if ($prerender_bot) {
            proxy_pass http://127.0.0.1:8000;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        try_files /index.html =404;
    }

    # Proxy para API Django
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Django já envia estes; evita duplicar com os add_header do server.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Admin Django — recomendado restringir por IP (evita exposição pública).
    # Descomente e ajuste os IPs da sua equipe/VPN antes de usar em produção:
    location /admin/ {
        # allow 203.0.113.10;   # IP fixo do escritório
        # allow 203.0.113.0/24; # faixa da VPN
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Arquivos estáticos Django
    location /static/ {
        alias /root/domecanico/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Mídia (fotos de veículos, logos) — servida DIRETO pelo nginx (storage local).
    # `root /srv/domecanico` serve /media/x de /srv/domecanico/media/x, que é o
    # bind-mount do docker-compose (/srv/domecanico/media:/app/media) onde o
    # backend grava os uploads. (Confere com o nginx ativo da VPS.)
    location /media/ {
        root /srv/domecanico;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    client_max_body_size 20M;
}
